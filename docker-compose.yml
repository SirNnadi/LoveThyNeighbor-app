services:

  database:
    image: postgres:17-bookworm
    container_name: housing-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: housing

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  backend:
    build:
      context: ./backend

    container_name: housing-backend

    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: housing
      DB_USER: postgres
      DB_PASSWORD: postgres
      CORS_ORIGIN: http://34.226.205.196:5173

    ports:
      - "3001:3001"

    depends_on:
      - database


  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://34.226.205.196:3001

    container_name: housing-frontend

    ports:
      - "5173:5173"

    environment:
      VITE_API_URL: http://34.226.205.196:3001

    depends_on:
      - backend


volumes:
  postgres_data: